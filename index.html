<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D41367">
<title>Ndjindji IA — Assistant du Président</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --framboise:#D41367;
    --framboise-light:#E8357F;
    --framboise-dark:#A80E52;
    --framboise-soft:#FCE8F1;
    --framboise-tint:#FEF4F9;
    --gold:#DB9A34;
    --gold-light:#F0B95A;
    --gold-soft:#FBF3E5;
    --paper:#FAF7F9;
    --paper-raised:#FFFFFF;
    --paper-warm:#FDF8FA;
    --ink:#14101A;
    --ink-soft:#5B4A56;
    --ink-faint:#958A94;
    --line:#F0E4EB;
    --line-strong:#E5D5DE;
    --radius:18px;
    --radius-sm:12px;
    --radius-lg:24px;
    --shadow-xs:0 1px 2px rgba(212,19,103,.04);
    --shadow-sm:0 1px 2px rgba(212,19,103,.06), 0 2px 8px rgba(212,19,103,.05);
    --shadow-md:0 2px 6px rgba(212,19,103,.08), 0 8px 24px rgba(212,19,103,.08);
    --shadow-lg:0 4px 12px rgba(212,19,103,.1), 0 16px 40px rgba(212,19,103,.1);
    --shadow-xl:0 8px 24px rgba(212,19,103,.12), 0 24px 64px rgba(212,19,103,.14);
    --shadow-focus:0 0 0 3px rgba(212,19,103,.15);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --ok:#2E7D5B;
    --ok-soft:#E1F1EA;
    --warn:#B4590E;
    --warn-soft:#FBEADA;
    --bronze:#CD7F32;
    --silver:#A8A9AD;
    --goldbadge:#DB9A34;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F0A14;
      --paper-raised:#1A121F;
      --paper-warm:#17101C;
      --ink:#F5EEF2;
      --ink-soft:#C8B8C2;
      --ink-faint:#8A7B86;
      --framboise-soft:#3A1828;
      --framboise-tint:#2A121E;
      --gold-soft:#2E2515;
      --line:#2E2132;
      --line-strong:#3E2E42;
      --shadow-xs:0 1px 2px rgba(0,0,0,.4);
      --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.2);
      --shadow-md:0 2px 6px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
      --shadow-lg:0 4px 12px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.3);
      --shadow-xl:0 8px 24px rgba(0,0,0,.5), 0 24px 64px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F0A14;
    --paper-raised:#1A121F;
    --paper-warm:#17101C;
    --ink:#F5EEF2;
    --ink-soft:#C8B8C2;
    --ink-faint:#8A7B86;
    --framboise-soft:#3A1828;
    --framboise-tint:#2A121E;
    --gold-soft:#2E2515;
    --line:#2E2132;
    --line-strong:#3E2E42;
    --shadow-xs:0 1px 2px rgba(0,0,0,.4);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.2);
    --shadow-md:0 2px 6px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
    --shadow-lg:0 4px 12px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.3);
    --shadow-xl:0 8px 24px rgba(0,0,0,.5), 0 24px 64px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; scroll-behavior:smooth;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 0% 0%, rgba(212,19,103,.06) 0%, transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(219,154,52,.04) 0%, transparent 40%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.55;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  h1,h2,h3{margin:0; letter-spacing:-0.025em;}
  h1{font-family:var(--font-display); font-weight:700; font-size:30px; color:var(--ink); line-height:1.15;}
  h2{font-family:var(--font-display); font-weight:700; font-size:23px; line-height:1.2;}
  h3{font-family:var(--font-body); font-weight:800; font-size:16px; letter-spacing:-0.01em;}
  p{margin:0 0 .7em;}
  button{font-family:var(--font-body); cursor:pointer; border:none; background:none; padding:0; transition:all .15s ease;}
  input,select,textarea{font-family:var(--font-body); font-size:15px; color:var(--ink); background:var(--paper-raised); border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:13px 15px; width:100%; transition:all .18s ease;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--framboise); box-shadow:var(--shadow-focus); transform:translateY(-1px);}
  label{display:block; font-size:13px; color:var(--ink-soft); margin:0 0 7px; font-weight:700; letter-spacing:0.01em;}
  .shell{display:flex; flex-direction:column; min-height:100vh;}
  .field{margin-bottom:15px;}
  nav.rail{display:flex; flex-direction:column; background:var(--paper-raised); border-bottom:1px solid var(--line); padding:16px 18px 0; flex-shrink:0; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;}
  nav.rail::before{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, var(--framboise), var(--gold), var(--framboise)); background-size:200% 100%; animation:shimmer 8s ease infinite;}
  @keyframes shimmer{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
  .brand{padding:0 0 16px;}
  .brand-logo{background:linear-gradient(135deg, var(--framboise-light) 0%, var(--framboise) 50%, var(--framboise-dark) 100%); border-radius:14px; padding:12px 16px; display:inline-block; max-width:230px; margin-bottom:14px; box-shadow:0 6px 20px rgba(212,19,103,.3), inset 0 1px 0 rgba(255,255,255,.25); position:relative; overflow:hidden;}
  .brand-logo::after{content:""; position:absolute; top:-50%; right:-50%; width:100%; height:200%; background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.35) 50%, transparent 60%); animation:shine 6s ease-in-out infinite; pointer-events:none;}
  @keyframes shine{0%,80%,100%{transform:translateX(-120%);}40%,60%{transform:translateX(120%);}}
  .brand .word{font-family:var(--font-body); font-style:normal; font-weight:900; font-size:24px; color:var(--framboise); line-height:1; letter-spacing:-0.7px; margin-bottom:2px;}
  .brand .sub{font-size:12px; color:var(--ink-faint); margin-top:6px; line-height:1.45; font-weight:600; letter-spacing:0.01em;}
  .brand .motto{font-size:11.5px; color:var(--framboise); margin-top:9px; font-style:italic; font-weight:600; letter-spacing:0.01em;}
  .lang-switch{display:flex; gap:6px; margin-bottom:12px; padding:0; max-width:250px;}
  .lang-btn{flex:1; padding:8px 12px; font-size:12px; font-weight:700; background:var(--framboise-tint); border:1.5px solid transparent; color:var(--ink-soft); border-radius:10px; transition:all .18s ease; letter-spacing:0.02em;}
  .lang-btn.active{background:linear-gradient(135deg, var(--framboise-light), var(--framboise)); color:#fff; border-color:transparent; box-shadow:0 4px 12px rgba(212,19,103,.3); transform:translateY(-1px);}
  .lang-btn:active{transform:scale(.96);}
  .theme-btn{display:flex; align-items:center; justify-content:center; gap:7px; background:var(--framboise-tint); border:1.5px solid var(--line); color:var(--framboise); padding:9px 14px; border-radius:10px; font-size:12px; font-weight:700; margin:0 0 14px; max-width:250px; transition:all .18s ease; letter-spacing:0.01em;}
  .theme-btn:hover{background:var(--framboise-soft); border-color:var(--framboise);}
  .theme-btn:active{transform:scale(.96);}
  .theme-btn svg{width:14px; height:14px;}
  .navrow{display:flex; overflow-x:auto; gap:4px; padding-bottom:0; -ms-overflow-style:none; scrollbar-width:none; margin:0 -18px; padding-left:18px; padding-right:18px;}
  .navrow::-webkit-scrollbar{display:none;}
  .navbtn{display:flex; align-items:center; gap:9px; white-space:nowrap; background:transparent; border:none; color:var(--ink-soft); padding:12px 15px; border-radius:11px 11px 0 0; font-size:13.5px; font-weight:700; flex-shrink:0; position:relative; letter-spacing:-0.005em;}
  .navbtn svg{width:17px; height:17px; opacity:.7; flex-shrink:0; transition:all .2s ease;}
  .navbtn.active{color:var(--framboise); background:var(--framboise-tint);}
  .navbtn.active svg{opacity:1; transform:scale(1.1);}
  .navbtn.active::after{content:""; position:absolute; left:15px; right:15px; bottom:0; height:3px; background:linear-gradient(90deg, var(--framboise), var(--gold)); border-radius:3px 3px 0 0; box-shadow:0 -2px 8px rgba(212,19,103,.4);}
  .navbtn:hover{color:var(--framboise);}
  .navbtn:hover svg{opacity:1;}
  .splash-overlay{position:fixed; inset:0; z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(160deg, #D41367 0%, #A80E52 50%, #4A0A26 100%); color:#fff; transition:opacity .6s ease, transform .6s ease; padding:24px; text-align:center;}
  .splash-overlay.hidden{opacity:0; transform:scale(1.05); pointer-events:none;}
  .splash-logo{width:110px; height:110px; border-radius:26px; background:linear-gradient(135deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.08) 100%); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:34px; color:#fff; letter-spacing:-1px; box-shadow:0 20px 50px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.3); margin-bottom:28px; opacity:0; transform:scale(.7); animation:splashLogoIn 0.9s cubic-bezier(.34,1.56,.64,1) 0.2s forwards; backdrop-filter:blur(10px); border:2px solid rgba(255,255,255,.2);}
  @keyframes splashLogoIn{to{opacity:1; transform:scale(1);}}
  .splash-title{font-family:var(--font-body); font-weight:900; font-size:36px; letter-spacing:2px; margin-bottom:12px; min-height:44px;}
  .splash-title span{display:inline-block; opacity:0; transform:translateY(20px); animation:letterIn 0.5s cubic-bezier(.34,1.56,.64,1) forwards;}
  @keyframes letterIn{to{opacity:1; transform:translateY(0);}}
  .splash-sub{font-size:14px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; opacity:0; animation:splashFadeIn 0.8s ease 1.6s forwards;}
  .splash-motto{font-family:var(--font-display); font-style:italic; font-size:15px; margin-top:32px; opacity:0; animation:splashFadeIn 0.8s ease 1.9s forwards; color:rgba(255,255,255,.85);}
  @keyframes splashFadeIn{to{opacity:1;}}
  .splash-bar{position:absolute; bottom:44px; left:50%; transform:translateX(-50%); width:60px; height:3px; background:rgba(255,255,255,.25); border-radius:100px; overflow:hidden;}
  .splash-bar::after{content:""; position:absolute; inset:0; background:#fff; border-radius:100px; transform-origin:left; animation:splashProgress 2.4s ease-out forwards;}
  @keyframes splashProgress{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  .badge-pill{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:100px; font-size:11.5px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:10px;}
  .badge-pill.bronze{background:linear-gradient(135deg, #F4D0A8, #E5A66D); color:#5C3A16;}
  .badge-pill.silver{background:linear-gradient(135deg, #E4E5E7, #C5C7CB); color:#3D3E42;}
  .badge-pill.gold{background:linear-gradient(135deg, #FBE4A6, #DB9A34); color:#5C3A16;}
  .badge-pill.platine{background:linear-gradient(135deg, #E8E0F5, #B9A3DD); color:#3D2C5C;}
  .activity-card{background:linear-gradient(135deg, var(--gold-soft) 0%, var(--paper-raised) 100%); border:1px solid var(--gold); border-radius:var(--radius); padding:20px 22px; margin-bottom:16px; box-shadow:var(--shadow-sm); display:flex; align-items:center; gap:16px;}
  .activity-icon{width:52px; height:52px; border-radius:15px; background:linear-gradient(135deg, var(--gold-light), var(--gold)); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 6px 16px rgba(219,154,52,.35);}
  .activity-icon svg{width:26px; height:26px;}
  .activity-content{flex:1; min-width:0;}
  .activity-num{font-family:var(--font-display); font-size:24px; font-weight:700; color:var(--gold); line-height:1; margin-bottom:4px; letter-spacing:-0.02em;}
  .activity-lbl{font-size:12.5px; color:var(--ink-soft); font-weight:600; line-height:1.4;}.cat-chip{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:100px; font-size:10.5px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase;}
  .cat-chip.communication{background:linear-gradient(135deg, #E0E7FF, #C7D2FE); color:#3730A3;}
  .cat-chip.finance{background:linear-gradient(135deg, #D1FAE5, #A7F3D0); color:#065F46;}
  .cat-chip.logistique{background:linear-gradient(135deg, #FEF3C7, #FDE68A); color:#92400E;}
  .cat-chip.programme{background:linear-gradient(135deg, #FCE7F3, #FBCFE8); color:#9D174D;}
  .cat-chip.administration{background:linear-gradient(135deg, #DBEAFE, #BFDBFE); color:#1E40AF;}
  .cat-chip.autre{background:var(--line); color:var(--ink-soft);}
  :root[data-theme="dark"] .cat-chip.communication{background:linear-gradient(135deg, #1E1B4B, #312E81); color:#C7D2FE;}
  :root[data-theme="dark"] .cat-chip.finance{background:linear-gradient(135deg, #064E3B, #065F46); color:#A7F3D0;}
  :root[data-theme="dark"] .cat-chip.logistique{background:linear-gradient(135deg, #78350F, #92400E); color:#FDE68A;}
  :root[data-theme="dark"] .cat-chip.programme{background:linear-gradient(135deg, #831843, #9D174D); color:#FBCFE8;}
  :root[data-theme="dark"] .cat-chip.administration{background:linear-gradient(135deg, #1E3A8A, #1E40AF); color:#BFDBFE;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .cat-chip.communication{background:linear-gradient(135deg, #1E1B4B, #312E81); color:#C7D2FE;}
    :root:not([data-theme="light"]) .cat-chip.finance{background:linear-gradient(135deg, #064E3B, #065F46); color:#A7F3D0;}
    :root:not([data-theme="light"]) .cat-chip.logistique{background:linear-gradient(135deg, #78350F, #92400E); color:#FDE68A;}
    :root:not([data-theme="light"]) .cat-chip.programme{background:linear-gradient(135deg, #831843, #9D174D); color:#FBCFE8;}
    :root:not([data-theme="light"]) .cat-chip.administration{background:linear-gradient(135deg, #1E3A8A, #1E40AF); color:#BFDBFE;}
  }
  .cat-select{width:auto; padding:7px 11px; font-size:12px; font-weight:700; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; transition:all .15s ease; max-width:170px;}
  .cat-select:hover{border-color:var(--framboise);}
  .cat-select:focus{border-color:var(--framboise); outline:none; box-shadow:var(--shadow-focus);}
  .quote-manage-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow-sm); transition:all .2s ease; position:relative;}
  .quote-manage-card:hover{box-shadow:var(--shadow-md); transform:translateY(-1px);}
  .quote-manage-text{font-family:var(--font-display); font-style:italic; font-size:14.5px; line-height:1.55; color:var(--ink); margin-bottom:8px;}
  .quote-manage-author{font-size:12px; color:var(--framboise); font-weight:800; letter-spacing:0.02em;}
  .quote-manage-day{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); margin-top:6px; padding:3px 8px; background:var(--paper-warm); border-radius:6px;}
  .quote-manage-actions{display:flex; gap:6px; position:absolute; top:14px; right:14px;}
  main{flex:1; min-width:0; padding:22px 18px 70px; max-width:900px; margin:0 auto; width:100%;}
  .panel{display:none;}
  .panel.active{display:block; animation:fadeUp .4s cubic-bezier(.16,1,.3,1);}
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .panel-head{margin-bottom:22px;}
  .panel-head h1{font-size:28px; color:var(--ink); margin-bottom:6px;}
  .panel-head p{color:var(--ink-soft); font-size:14px; margin-top:0; max-width:60ch; line-height:1.55;}
  .divider{border:none; border-top:1px solid var(--line); margin:24px 0;}
  .card{background:var(--paper-raised); border-radius:var(--radius); padding:22px; margin-bottom:16px; box-shadow:var(--shadow-sm); border:1px solid var(--line); transition:all .25s cubic-bezier(.16,1,.3,1);}
  .card:hover{box-shadow:var(--shadow-md); transform:translateY(-1px);}
  .section-title{font-size:15px; font-weight:800; color:var(--ink); margin-bottom:5px; letter-spacing:-0.01em;}
  .section-sub{font-size:12.5px; color:var(--ink-faint); margin-bottom:15px; line-height:1.5;}
  .row{display:flex; gap:11px; align-items:flex-end; flex-wrap:wrap;}
  .row > *{flex:1; min-width:140px;}
  .btn{display:inline-flex; align-items:center; gap:9px; justify-content:center; padding:13px 20px; border-radius:13px; font-size:14px; font-weight:800; background:linear-gradient(135deg, var(--framboise-light) 0%, var(--framboise) 60%, var(--framboise-dark) 100%); color:#fff; box-shadow:0 4px 14px rgba(212,19,103,.3), inset 0 1px 0 rgba(255,255,255,.2); letter-spacing:0.005em; position:relative; overflow:hidden; transition:all .2s cubic-bezier(.16,1,.3,1);}
  .btn::before{content:""; position:absolute; top:0; left:-100%; width:100%; height:100%; background:linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent); transition:left .6s ease;}
  .btn:hover::before{left:100%;}
  .btn:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(212,19,103,.4), inset 0 1px 0 rgba(255,255,255,.25);}
  .btn:active{transform:scale(.97); box-shadow:0 2px 8px rgba(212,19,103,.3);}
  .btn svg{width:16px; height:16px; position:relative; z-index:1;}
  .btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none; transform:none;}
  .btn:disabled::before{display:none;}
  .btn.primary{background:linear-gradient(135deg, var(--framboise-light) 0%, var(--framboise) 60%, var(--framboise-dark) 100%);}
  .btn.ghost{background:transparent; color:var(--framboise); border:1.5px solid var(--framboise-soft); box-shadow:none;}
  .btn.ghost:hover{background:var(--framboise-tint); border-color:var(--framboise); box-shadow:0 4px 12px rgba(212,19,103,.15);}
  .btn.small{padding:9px 15px; font-size:13px; border-radius:11px; gap:7px;}
  .btn.icon-only{padding:9px; background:transparent; color:var(--ink-faint); box-shadow:none; border-radius:10px; position:relative;}
  .btn.icon-only::before{display:none;}
  .btn.icon-only:hover{color:var(--framboise); background:var(--framboise-tint); transform:scale(1.05);}
  .btn.icon-only:active{transform:scale(.92);}
  .btn.icon-only svg{width:16px; height:16px; position:static;}
  .list{display:flex; flex-direction:column; gap:11px;}
  .list-row{display:flex; gap:13px; align-items:center; background:var(--paper-raised); border-radius:13px; padding:15px 15px 15px 18px; border:1px solid var(--line); box-shadow:var(--shadow-sm); position:relative; transition:all .22s cubic-bezier(.16,1,.3,1); overflow:hidden;}
  .list-row:hover{box-shadow:var(--shadow-md); transform:translateX(2px);}
  .list-row::before{content:""; position:absolute; left:0; top:16px; bottom:16px; width:3px; border-radius:0 3px 3px 0; background:var(--framboise); transition:all .25s ease;}
  .list-row.status-termine::before, .list-row.status-atteint::before, .list-row.status-confirme::before{background:var(--ok);}
  .list-row.status-attente::before, .list-row.status-en_cours::before{background:var(--gold);}
  .list-row.status-a_faire::before, .list-row.status-a_initier::before, .list-row.status-planifie::before{background:var(--ink-faint);}
  .list-row.urgent::before{background:var(--gold) !important;}
  .list-row.overdue::before{background:#DC2626 !important;}
  .list-row.urgent{background:linear-gradient(90deg, #FFF8E7 0%, var(--paper-raised) 45%);}
  .list-row.overdue{background:linear-gradient(90deg, #FEE2E2 0%, var(--paper-raised) 45%);}
  .list-row.priority{box-shadow:0 0 0 1.5px rgba(245,166,35,.4), 0 4px 16px rgba(245,166,35,.15);}
  .list-row.priority::before{background:var(--gold) !important;}
  .list-row .main-col{flex:1; min-width:0;}
  .list-row .title{font-size:14.5px; font-weight:800; color:var(--ink); letter-spacing:-0.005em; line-height:1.35;}
  .list-row .meta{font-size:12.5px; color:var(--ink-faint); margin-top:4px; line-height:1.4; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}

function createStore(name, seed){
  const saved = lsGet(name, null);
  const items = (saved && Array.isArray(saved)) ? saved : seed.map(x => Object.assign({id:uid()}, x));
  if(!saved) lsSet(name, items);
  stores[name] = {
    items: items,
    add(data){ const item = Object.assign({id:uid()}, data); this.items.push(item); this._save(); renderActivePanel(); renderDashboardStats(); updateGlobalSearch(); },
    updateItem(id, patch){ const it = this.items.find(i => i.id === id); if(it){ Object.assign(it, patch); this._save(); renderActivePanel(); renderDashboardStats(); } },
    removeItem(id){ this.items = this.items.filter(i => i.id !== id); this._save(); renderActivePanel(); renderDashboardStats(); updateGlobalSearch(); },
    _save(){ lsSet(name, this.items); }
  };
}

function getQuoteOfDay(){

function getMonthActivity(){
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const tachesDone = stores.taches.items.filter(function(x){ return x.statut === "termine" && x.dateTermine && new Date(x.dateTermine).getTime() >= monthStart; }).length;
  const projetsDone = stores.projets.items.filter(function(x){ return x.statut === "termine" && x.dateTermine && new Date(x.dateTermine).getTime() >= monthStart; }).length;
  const docsCrees = stores.documents_sauves.items.filter(function(x){ return x.date && new Date(x.date).getTime() >= monthStart; }).length;

}
function getBadge(total){
  if(total >= 50) return {id:"platine", label:t("badgePlatine"), desc:t("badgePlatineDesc"), next:null};
  if(total >= 25) return {id:"gold", label:t("badgeOr"), desc:t("badgeOrDesc"), next:{level:"platine", remaining:50-total}};
  if(total >= 10) return {id:"silver", label:t("badgeArgent"), desc:t("badgeArgentDesc"), next:{level:"gold", remaining:25-total}};
  if(total >= 3) return {id:"bronze", label:t("badgeBronze"), desc:t("badgeBronzeDesc"), next:{level:"silver", remaining:10-total}};

}

let recognition = null, recognizing = false, mouthTimer = null, blinkTimer = null, sttSupported = false, ttsSupported = false, voiceEngineReady = false;
function initVoiceEngine(){

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function togglePriority(id){
  const t2 = stores.taches.items.find(function(x){ return x.id === id; });
  if(!t2) return;
  const newVal = !t2.priority;
  stores.taches.updateItem(id, {priority: newVal});
  toast(newVal ? "⭐ Marquée prioritaire" : "Priorité retirée");
}
function getCatLabel(cat){ if(!cat) return ""; const map = {communication:"catCommunication",finance:"catFinance",logistique:"catLogistique",programme:"catProgramme",administration:"catAdministration",autre:"catAutre"}; return map[cat] ? t(map[cat]) : cat; }
function getCatEmoji(cat){ const map = {communication:"💬",finance:"💰",logistique:"📦",programme:"🎯",administration:"📋",autre:"📌"}; return map[cat] || "📌"; }
function getFilteredSortedTaches(){
  let items = stores.taches.items.slice();
  if(currentFilter === "urgent"){ items = items.filter(function(t2){ const info = getUrgencyInfo(t2.echeance, t2.statut); return info.level === "urgent" || info.level === "overdue"; }); }
  else if(currentFilter !== "all"){ items = items.filter(function(t2){ return t2.statut === currentFilter; }); }
  if(currentCatFilter === "none"){ items = items.filter(function(t2){ return !t2.categorie; }); }
  else if(currentCatFilter !== "all"){ items = items.filter(function(t2){ return t2.categorie === currentCatFilter; }); }
  items.sort(function(a, b){ const aPri = a.priority && a.statut !== "termine" ? 1 : 0; const bPri = b.priority && b.statut !== "termine" ? 1 : 0; return bPri - aPri; });
  if(currentSort === "date_asc"){ items.sort(function(a,b){ if(!a.echeance && !b.echeance) return 0; if(!a.echeance) return 1; if(!b.echeance) return -1; return a.echeance.localeCompare(b.echeance); }); }
  else if(currentSort === "date_desc"){ items.sort(function(a,b){ if(!a.echeance && !b.echeance) return 0; if(!a.echeance) return 1; if(!b.echeance) return -1; return b.echeance.localeCompare(a.echeance); }); }
  else if(currentSort === "created_desc"){ items.sort(function(a,b){ return (b.id || "").localeCompare(a.id || ""); }); }
  else if(currentSort === "alpha"){ items.sort(function(a,b){ return (a.titre || "").localeCompare(b.titre || ""); }); }
  return items;
}
function updateTaskCount(){
  const el = $("#taskCount"); if(!el) return;

  const filtered = getFilteredSortedTaches().length;
  if(filtered === total) el.textContent = total + (currentLang === "fr" ? (total > 1 ? " tâches" : " tâche") : " task(s)");
  else el.textContent = filtered + " / " + total;
}

  el.querySelectorAll("select").forEach(function(s){ s.addEventListener("change", function(){ stores.objectifs.updateItem(s.dataset.id, {statut:s.value}); renderObjectifs(); toast(t("toastModifie")); }); });
  el.querySelectorAll("[data-remove-obj]").forEach(function(b){ b.addEventListener("click", function(){ if(confirm(t("confirmSuppr"))){ stores.objectifs.removeItem(b.dataset.removeObj); toast(t("toastSupprime")); } }); });
  const pct = items.length ? Math.round(items.reduce(function(s,o){ return s + (o.statut === "atteint" ? 1 : o.statut === "en_cours" ? 0.5 : 0); }, 0) / items.length * 100) : 0;
  const bar = $("#objProgress"), lbl = $("#objProgressLabel");
  if(bar) bar.style.width = pct + "%";
  if(lbl) lbl.textContent = pct + "% " + t("objAxesEngages");
}
function wireObjectifs(){
  const btn = $("#objAddBtn"); if(!btn) return;
  btn.addEventListener("click", function(){
    const domaine = $("#objDomaine").value.trim(); if(!domaine){ toast("Nom requis"); return; }
    stores.objectifs.add({domaine:domaine, statut:"a_initier", notes:""});
    $("#objDomaine").value = "";
    toast(t("toastAjoute"));
  });
}
function panelDocuments(){
  const types = [
    {id:"lettre", icon:"docLetter", label:t("docLettre")},
    {id:"communique", icon:"docNews", label:t("docCommunique")},
    {id:"compteRendu", icon:"docReport", label:t("docCompteRendu")},
    {id:"discours", icon:"docSpeech", label:t("docDiscours")}
  ];
  return '' +
  '<section class="panel" data-panel="documents">' +
    '<div class="panel-head"><h1>' + esc(t("documentsTitle")) + '</h1><p>' + esc(t("documentsSub")) + '</p></div>' +
    '<div class="card">' +
      '<div class="section-title">' + esc(t("docType")) + '</div>' +
      '<div class="doc-grid">' +
        types.map(function(dt){ return '<button class="doc-card' + (dt.id===currentDocType?' active':'') + '" data-doctype="' + dt.id + '"><div class="doc-card-icon">' + ICONS[dt.icon] + '</div><div class="doc-card-title">' + esc(dt.label) + '</div></button>'; }).join("") +
      '</div>' +
      '<div class="field"><label>' + esc(t("docDest")) + '</label><input type="text" id="docDest" placeholder="' + esc(t("docPlaceholderDest")) + '"></div>' +
      '<div class="field"><label>' + esc(t("docObjet")) + '</label><input type="text" id="docObjet" placeholder="' + esc(t("docPlaceholderObjet")) + '"></div>' +
      '<div class="field"><label>' + esc(t("docDate")) + '</label><input type="date" id="docDate"></div>' +
      '<div class="field"><label>' + esc(t("docCorps")) + '</label><textarea id="docCorps" placeholder="' + esc(t("docPlaceholderCorps")) + '" style="min-height:120px"></textarea></div>' +
      '<div class="note muted" style="margin-bottom:14px">' + esc(t("docPromptHelp")) + '</div>' +
      '<div class="quick-actions" style="margin-top:16px">' +
        '<button class="btn primary" id="docPromptBtn">' + ICONS.sparkle + ' ' + esc(t("docPromptBtn")) + '</button>' +
        '<button class="btn ghost small" id="docClearBtn">' + esc(t("docClearBtn")) + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="section-title">' + esc(t("docColler")) + '</div>' +
      '<div class="section-sub">Collez ici la réponse de Claude ou ChatGPT.</div>' +
      '<textarea id="docPaste" placeholder="Collez le texte généré par l\'IA ici..." style="min-height:160px; margin-bottom:11px"></textarea>' +
      '<div class="quick-actions" style="margin-top:0">' +
        '<button class="btn primary small" id="docSaveBtn">' + ICONS.check + ' ' + esc(t("docSaveBtn")) + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="section-title">' + esc(t("docSavedTitle")) + '</div>' +
      '<div class="list" id="docsSauvesList"></div>' +
    '</div>' +
  '</section>';
}
function wireDocuments(){
  $$("[data-doctype]").forEach(function(b){
    b.addEventListener("click", function(){
      currentDocType = b.dataset.doctype;
      $$("[data-doctype]").forEach(function(x){ x.classList.remove("active"); });
      b.classList.add("active");
    });
  });
  const promptBtn = $("#docPromptBtn"); if(promptBtn) promptBtn.addEventListener("click", copyPromptForAI);
  const clearBtn = $("#docClearBtn"); if(clearBtn) clearBtn.addEventListener("click", function(){
    $("#docDest").value = ""; $("#docObjet").value = ""; $("#docDate").value = ""; $("#docCorps").value = ""; $("#docPaste").value = "";
  });
  const saveBtn = $("#docSaveBtn"); if(saveBtn) saveBtn.addEventListener("click", savePastedDoc);
}
function renderDocuments(){ /* rien de dynamique */ }
function copyPromptForAI(){
  const dest = $("#docDest").value.trim();
  const objet = $("#docObjet").value.trim();
  const date = $("#docDate").value;
  const corps = $("#docCorps").value.trim();
  const dateStr = date ? fmtDate(date) : "(date à préciser)";
  const fr = currentLang === "fr";
  const typeLbl = {lettre:t("docLettre"), communique:t("docCommunique"), compteRendu:t("docCompteRendu"), discours:t("docDiscours")}[currentDocType];
  let prompt = "";
  if(fr){
    prompt = "Tu es assistant de rédaction pour le Rotaract Club Ndjindji (" + DISTRICT + ").\nRédige un document de type : " + typeLbl + ".\n\nContexte :\n- Club : Rotaract Club Ndjindji\n- District : " + DISTRICT + "\n- Président : " + PRESIDENT_NAME + " (" + PRESIDENT_TERM + ")\n- Devise : Service, Action et Camaraderie\n- Projet prioritaire : Bibliothèque communautaire de Loudima\n\nParamètres du document :\n- Destinataire : " + (dest || "(à préciser)") + "\n- Objet : " + (objet || "(à préciser)") + "\n- Date : " + dateStr + "\n- Points à aborder :\n" + (corps || "(à préciser)") + "\n\nConsignes :\n- Rédige en français professionnel et irréprochable.\n- Ton diplomatique, inspirant, crédible.\n- N'utilise ni emoji ni symbole décoratif.\n- Structure claire, paragraphes aérés.\n- Termine par la signature : " + PRESIDENT_NAME + ", " + PRESIDENT_TERM + ", " + CLUB_NAME + ", " + DISTRICT + ".\n- Réponds uniquement avec le texte final du document, sans commentaire.";
  } else {
    prompt = "You are a writing assistant for Rotaract Club Ndjindji (" + DISTRICT + ").\nWrite a document of type: " + typeLbl + ".\n\nContext:\n- Club: Rotaract Club Ndjindji\n- District: " + DISTRICT + "\n- President: " + PRESIDENT_NAME + " (" + PRESIDENT_TERM + ")\n- Motto: Service, Action and Fellowship\n- Priority project: Loudima Community Library\n\nDocument parameters:\n- Recipient: " + (dest || "(to be specified)") + "\n- Subject: " + (objet || "(to be specified)") + "\n- Date: " + dateStr + "\n- Points to address:\n" + (corps || "(to be specified)") + "\n\nGuidelines:\n- Write in professional English.\n- Diplomatic, inspiring, credible tone.\n- No emojis, no decorative symbols.\n- Clear structure, spaced paragraphs.\n- End with signature: " + PRESIDENT_NAME + ", " + PRESIDENT_TERM + ", " + CLUB_NAME + ", " + DISTRICT + ".\n- Reply only with the final document text, no comment.";
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(prompt).then(function(){ toast(t("docPromptCopie")); }).catch(function(){
      const ta = document.createElement("textarea"); ta.value = prompt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast(t("docPromptCopie")); }catch(e){} document.body.removeChild(ta);
    });
  } else {
    const ta = document.createElement("textarea"); ta.value = prompt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast(t("docPromptCopie")); }catch(e){} document.body.removeChild(ta);
  }
}
function savePastedDoc(){
  const content = $("#docPaste").value.trim();
  if(!content){ toast("Collez d'abord un texte"); return; }
  const dest = $("#docDest").value.trim();
  const objet = $("#docObjet").value.trim();
  const typeLbl = {lettre:t("docLettre"), communique:t("docCommunique"), compteRendu:t("docCompteRendu"), discours:t("docDiscours")}[currentDocType];
  stores.documents_sauves.add({
    type: currentDocType,
    typeLabel: typeLbl,
    destinataire: dest,
    sujet: objet || typeLbl,
    contenu: content,
    date: new Date().toISOString()
  });
  $("#docPaste").value = "";
  renderDocsSauves();
  toast(t("docSaved"));
}
function renderDocsSauves(){
  const el = $("#docsSauvesList"); if(!el) return;
  const items = stores.documents_sauves.items.slice().reverse();
  if(!items.length){ el.innerHTML = '<div class="empty">' + esc(t("docEmpty")) + '</div>'; return; }
  el.innerHTML = items.map(function(d){
    const preview = d.contenu.substring(0, 100).replace(/\n/g, " ") + (d.contenu.length > 100 ? "..." : "");
    return '<div class="list-row"><div class="main-col"><div class="title">' + esc(d.sujet) + '</div><div class="meta">' + esc(d.typeLabel) + ' · ' + esc(fmtDate(d.date.substring(0,10))) + (d.destinataire ? ' · ' + esc(d.destinataire) : '') + '</div><div class="meta" style="margin-top:6px; font-style:italic">' + esc(preview) + '</div></div>' +
      '<button class="btn icon-only" data-remove-doc="' + d.id + '">' + ICONS.trash + '</button></div>';
  }).join("");
  el.querySelectorAll("[data-remove-doc]").forEach(function(b){ b.addEventListener("click", function(){ if(confirm(t("confirmSuppr"))){ stores.documents_sauves.removeItem(b.dataset.removeDoc); renderDocsSauves(); toast(t("toastSupprime")); } }); });
}
function panelCitations(){
  return '' +
  '<section class="panel" data-panel="citations">' +
    '<div class="panel-head"><h1>' + esc(t("citationsTitle")) + '</h1><p>' + esc(t("citationsSub")) + '</p></div>' +
    '<div class="card">' +
      '<div class="section-title">' + (editingCitationId ? "Modifier une citation" : esc(t("citationAddBtn"))) + '</div>' +
      '<div class="field"><label>' + esc(t("citationTexte")) + '</label><textarea id="citTexte" placeholder="« Votre citation inspirante... »" style="min-height:80px"></textarea></div>' +
      '<div class="field"><label>' + esc(t("citationAuteur")) + '</label><input type="text" id="citAuteur" placeholder="Ex. Proverbe africain"></div>' +
      '<div class="field"><label>' + esc(t("citationJour")) + '</label><select id="citJour"><option value="lundi">Lundi</option><option value="mardi">Mardi</option><option value="mercredi">Mercredi</option><option value="jeudi">Jeudi</option><option value="vendredi">Vendredi</option><option value="samedi">Samedi</option><option value="dimanche">Dimanche</option></select></div>' +
      '<div class="quick-actions" style="margin-top:16px">' +
        '<button class="btn primary" id="citSaveBtn">' + ICONS.check + ' ' + esc(t("citationSaveBtn")) + '</button>' +
        (editingCitationId ? '<button class="btn ghost small" id="citCancelBtn">Annuler</button>' : '') +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="section-title">' + esc(t("citationsTitle")) + '</div>' +
      '<div id="citationsList"></div>' +
    '</div>' +
  '</section>';
}
function wireCitations(){
  const saveBtn = $("#citSaveBtn"); if(saveBtn) saveBtn.addEventListener("click", saveCitation);
  const cancelBtn = $("#citCancelBtn"); if(cancelBtn) cancelBtn.addEventListener("click", function(){ editingCitationId = null; renderCitations(); });
}
function renderCitations(){
  const el = $("#citationsList"); if(!el) return;
  const items = stores.citations.items.slice().sort(function(a,b){ const order = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"]; return order.indexOf(a.jour) - order.indexOf(b.jour); });
  if(!items.length){ el.innerHTML = '<div class="empty">' + esc(t("citationEmpty")) + '</div>'; return; }
  el.innerHTML = items.map(function(c){
    return '<div class="quote-manage-card">' +
      '<div class="quote-manage-actions">' +
        '<button class="btn icon-only" data-edit-cit="' + c.id + '" title="Modifier">' + ICONS.edit + '</button>' +
        '<button class="btn icon-only" data-remove-cit="' + c.id + '" title="Supprimer">' + ICONS.trash + '</button>' +
      '</div>' +
      '<div class="quote-manage-text">« ' + esc(c.texte) + ' »</div>' +
      '<div class="quote-manage-author">— ' + esc(c.auteur) + '</div>' +
      '<div class="quote-manage-day">' + esc(c.jour || "auto") + '</div>' +
    '</div>';
  }).join("");
  el.querySelectorAll("[data-remove-cit]").forEach(function(b){ b.addEventListener("click", function(){ if(confirm(t("confirmSuppr"))){ stores.citations.removeItem(b.dataset.removeCit); renderCitations(); toast(t("citationDelete")); } }); });
  el.querySelectorAll("[data-edit-cit]").forEach(function(b){ b.addEventListener("click", function(){ editCitation(b.dataset.editCit); }); });
}
function saveCitation(){
  const texte = $("#citTexte").value.trim();
  const auteur = $("#citAuteur").value.trim();
  const jour = $("#citJour").value;
  if(!texte){ toast("Texte requis"); return; }
  if(!auteur){ toast("Auteur requis"); return; }
  if(editingCitationId){
    stores.citations.updateItem(editingCitationId, {texte:texte, auteur:auteur, jour:jour});
    editingCitationId = null;
  } else {
    stores.citations.add({texte:texte, auteur:auteur, jour:jour});
  }
  renderCitations();
  toast(t("citationSaved"));
}
function editCitation(id){
  const c = stores.citations.items.find(function(x){ return x.id === id; });
  if(!c) return;
  editingCitationId = id;
  renderActivePanel();
  setTimeout(function(){
    const el = $("#citTexte"); if(el) el.value = c.texte;
    const el2 = $("#citAuteur"); if(el2) el2.value = c.auteur;
    const el3 = $("#citJour"); if(el3) el3.value = c.jour;
  }, 100);
}
function initSplash(){
  const overlay = $("#splashOverlay");
  if(overlay){ overlay.style.display = "none"; }
}
function boot(){
  initStores();
  initSplash();
  renderShell();
  wireLangSwitch();
  initTheme();
  const sub = $("#brandSub"), motto = $("#brandMotto");
  if(sub) sub.innerHTML = t("brandSub");
  if(motto) motto.textContent = t("brandMotto");
  renderDashboardStats();
  renderActivePanel();
  setTimeout(initVoiceEngine, 700);
}
if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", boot); } else { boot(); }
</script>
</body>
</html>
