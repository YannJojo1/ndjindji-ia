<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17458F">
<title>Ndjindji IA — Assistant du Président</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --rotary-blue:#17458F;
    --rotary-blue-light:#2E5EA8;
    --rotary-blue-dark:#0E2E63;
    --rotary-gold:#F7A81B;
    --rotary-gold-light:#FBC15A;
    --rotaract-cranberry:#D41367;
    --rotaract-cranberry-light:#E8357F;
    --rotaract-cranberry-dark:#A80E52;
    --royal-azure:#0067C8;
    --sky-blue:#00ADBB;
    --vibrant-orange:#F17600;
    --paper:#F5F7FB;
    --paper-raised:#FFFFFF;
    --paper-warm:#FAF6F1;
    --ink:#101828;
    --ink-soft:#475467;
    --ink-faint:#98A2B3;
    --line:#E4E7EC;
    --line-strong:#D0D5DD;
    --radius:16px;
    --radius-sm:10px;
    --radius-lg:22px;
    --shadow-xs:0 1px 2px rgba(16,24,40,.04);
    --shadow-sm:0 1px 3px rgba(16,24,40,.08), 0 2px 8px rgba(16,24,40,.04);
    --shadow-md:0 4px 8px rgba(16,24,40,.06), 0 12px 32px rgba(16,24,40,.08);
    --shadow-lg:0 8px 16px rgba(16,24,40,.08), 0 24px 64px rgba(16,24,40,.12);
    --shadow-focus:0 0 0 4px rgba(212,19,103,.15);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --ok:#12B76A;
    --ok-soft:#ECFDF3;
    --warn:#F79009;
    --warn-soft:#FFFAEB;
    --error:#F04438;
    --error-soft:#FEF3F2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0B0F19;
      --paper-raised:#151B28;
      --paper-warm:#1A1F2E;
      --ink:#F5F7FB;
      --ink-soft:#B8C0D0;
      --ink-faint:#6B7280;
      --line:#2A3244;
      --line-strong:#3A4358;
      --rotary-blue:#6C9BE0;
      --rotaract-cranberry:#F0619A;
      --shadow-xs:0 1px 2px rgba(0,0,0,.4);
      --shadow-sm:0 1px 3px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
      --shadow-md:0 4px 8px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
      --shadow-lg:0 8px 16px rgba(0,0,0,.5), 0 24px 64px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B0F19;
    --paper-raised:#151B28;
    --paper-warm:#1A1F2E;
    --ink:#F5F7FB;
    --ink-soft:#B8C0D0;
    --ink-faint:#6B7280;
    --line:#2A3244;
    --line-strong:#3A4358;
    --rotary-blue:#6C9BE0;
    --rotaract-cranberry:#F0619A;
    --shadow-xs:0 1px 2px rgba(0,0,0,.4);
    --shadow-sm:0 1px 3px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
    --shadow-md:0 4px 8px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    --shadow-lg:0 8px 16px rgba(0,0,0,.5), 0 24px 64px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; scroll-behavior:smooth;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 0% 0%, rgba(23,69,143,.04) 0%, transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(212,19,103,.04) 0%, transparent 40%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.55;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  h1,h2,h3{margin:0; letter-spacing:-0.025em;}
  h1{font-family:var(--font-display); font-weight:700; font-size:32px; color:var(--ink); line-height:1.15;}
  h2{font-family:var(--font-display); font-weight:700; font-size:24px; line-height:1.2;}
  h3{font-family:var(--font-body); font-weight:800; font-size:16px; letter-spacing:-0.01em;}
  p{margin:0 0 .7em;}
  button{font-family:var(--font-body); cursor:pointer; border:none; background:none; padding:0; transition:all .15s ease;}
  input,select,textarea{font-family:var(--font-body); font-size:15px; color:var(--ink); background:var(--paper-raised); border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:13px 15px; width:100%; transition:all .18s ease;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--rotaract-cranberry); box-shadow:var(--shadow-focus);}
  label{display:block; font-size:13px; color:var(--ink-soft); margin:0 0 7px; font-weight:700; letter-spacing:0.01em;}
  .shell{display:flex; flex-direction:column; min-height:100vh;}
  .field{margin-bottom:15px;}
  nav.rail{display:flex; flex-direction:column; background:var(--rotaract-cranberry); border-bottom:1px solid var(--line); padding:0; flex-shrink:0; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;}
  nav.rail::before{content:""; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg, var(--rotary-gold), var(--rotaract-cranberry), var(--rotary-gold)); background-size:200% 100%; animation:shimmer 8s ease infinite;}
  @keyframes shimmer{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
  .brand{background:linear-gradient(135deg, var(--rotaract-cranberry-dark) 0%, var(--rotaract-cranberry) 100%); padding:24px 20px 20px; color:#fff; position:relative; overflow:hidden;}
  .brand::after{content:""; position:absolute; top:-60px; right:-60px; width:200px; height:200px; background:radial-gradient(circle, rgba(247,168,27,.15) 0%, transparent 70%); border-radius:50%; pointer-events:none;}
  .brand-top{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
  .rotary-wheel{width:110px; height:70px; flex-shrink:0; background:#fff; border-radius:14px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(212,19,103,.3); position:relative; overflow:hidden; padding:6px;}
  .rotary-wheel img{width:100%; height:100%; object-fit:contain; display:block; max-width:100%; max-height:100%;}
  /* Style du logo (image) géré dans .rotary-wheel img ci-dessus */
  .brand-club{flex:1; min-width:0;}
  .brand-club .president{font-size:11px; color:var(--rotary-gold); font-weight:700; letter-spacing:0.15em; text-transform:uppercase; margin-bottom:4px;}
  .brand-club .name{font-family:var(--font-body); font-weight:900; font-size:18px; line-height:1.15; letter-spacing:-0.4px; color:#fff;}
  .brand-club .district{font-size:11.5px; color:rgba(255,255,255,.7); margin-top:3px; font-weight:600; letter-spacing:0.02em;}
  .brand-title{font-family:var(--font-display); font-style:italic; font-weight:500; font-size:26px; color:#fff; line-height:1.1; margin-bottom:8px;}
  .brand-title span{color:var(--rotary-gold);}
  .brand-motto{font-size:11.5px; color:rgba(255,255,255,.65); font-style:italic; letter-spacing:0.02em;}
  .lang-switch{display:flex; gap:6px; margin-bottom:12px; padding:0; max-width:250px;}.lang-switch{display:flex; gap:6px; margin-bottom:0; padding:0; max-width:250px;}
  .lang-btn{flex:1; padding:8px 12px; font-size:12px; font-weight:700; background:rgba(255,255,255,.1); border:1.5px solid rgba(255,255,255,.15); color:rgba(255,255,255,.8); border-radius:10px; transition:all .18s ease; letter-spacing:0.02em;}
  .lang-btn.active{background:var(--rotary-gold); color:#14101A; border-color:var(--rotary-gold); box-shadow:0 4px 12px rgba(247,168,27,.4); transform:translateY(-1px);}
  .lang-btn:active{transform:scale(.96);}
  .theme-btn{display:flex; align-items:center; justify-content:center; gap:7px; background:rgba(255,255,255,.1); border:1.5px solid rgba(255,255,255,.15); color:rgba(255,255,255,.85); padding:9px 14px; border-radius:10px; font-size:12px; font-weight:700; margin:0 0 14px; max-width:250px; transition:all .18s ease; letter-spacing:0.01em;}
  .theme-btn:hover{background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.3);}
  .theme-btn:active{transform:scale(.96);}
  .theme-btn svg{width:14px; height:14px;}
  .navrow{display:flex; overflow-x:auto; gap:4px; padding-bottom:0; -ms-overflow-style:none; scrollbar-width:none; background:var(--rotaract-cranberry); padding-left:14px; padding-right:14px;}
  .navrow::-webkit-scrollbar{display:none;}
  .navbtn{display:flex; align-items:center; gap:8px; white-space:nowrap; background:transparent; border:none; color:rgba(255,255,255,.7); padding:13px 14px; border-radius:0; font-size:13px; font-weight:700; flex-shrink:0; position:relative; letter-spacing:-0.005em; transition:all .18s ease;}
  .navbtn svg{width:16px; height:16px; opacity:.75; flex-shrink:0; transition:all .2s ease;}
  .navbtn.active{color:#fff;}
  .navbtn.active svg{opacity:1; transform:scale(1.05);}
  .navbtn.active::after{content:""; position:absolute; left:14px; right:14px; bottom:0; height:3px; background:var(--rotary-gold); border-radius:3px 3px 0 0; box-shadow:0 -2px 12px rgba(247,168,27,.6);}
  .navbtn:hover{color:#fff;}
  .navbtn:hover svg{opacity:1;}
  main{flex:1; min-width:0; padding:22px 18px 70px; max-width:1000px; margin:0 auto; width:100%;}
  .panel{display:none;}
  .panel.active{display:block; animation:fadeUp .4s cubic-bezier(.16,1,.3,1);}
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .panel-head{margin-bottom:24px;}
  .panel-head h1{font-size:30px; color:var(--ink); margin-bottom:6px;}
  .panel-head p{color:var(--ink-soft); font-size:14px; margin-top:0; max-width:65ch; line-height:1.55;}
  .divider{border:none; border-top:1px solid var(--line); margin:24px 0;}
  .card{background:var(--paper-raised); border-radius:var(--radius); padding:22px; margin-bottom:16px; box-shadow:var(--shadow-sm); border:1px solid var(--line); transition:all .25s cubic-bezier(.16,1,.3,1);}
  .card:hover{box-shadow:var(--shadow-md);}
  .section-title{font-size:15px; font-weight:800; color:var(--ink); margin-bottom:5px; letter-spacing:-0.01em; display:flex; align-items:center; gap:8px;}
  .section-title svg{width:18px; height:18px; color:var(--rotary-blue);}
  .section-sub{font-size:12.5px; color:var(--ink-faint); margin-bottom:15px; line-height:1.5;}
  .row{display:flex; gap:11px; align-items:flex-end; flex-wrap:wrap;}
  .row > *{flex:1; min-width:140px;}
  .btn{display:inline-flex; align-items:center; gap:9px; justify-content:center; padding:12px 20px; border-radius:12px; font-size:14px; font-weight:800; background:linear-gradient(135deg, var(--rotaract-cranberry-light) 0%, var(--rotaract-cranberry) 100%); color:#fff; box-shadow:0 4px 14px rgba(212,19,103,.25); letter-spacing:0.005em; position:relative; overflow:hidden; transition:all .2s cubic-bezier(.16,1,.3,1);}
  .btn::before{content:""; position:absolute; top:0; left:-100%; width:100%; height:100%; background:linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent); transition:left .6s ease;}
  .btn:hover::before{left:100%;}
  .btn:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(212,19,103,.4);}
  .btn:active{transform:scale(.97);}
  .btn svg{width:16px; height:16px; position:relative; z-index:1;}
  .btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none; transform:none;}
  .btn:disabled::before{display:none;}
  .btn.primary{background:linear-gradient(135deg, var(--rotaract-cranberry-light) 0%, var(--rotaract-cranberry) 100%);}
  .btn.blue{background:linear-gradient(135deg, var(--rotary-blue-light) 0%, var(--rotary-blue-dark) 100%); box-shadow:0 4px 14px rgba(23,69,143,.25);}
  .btn.blue:hover{box-shadow:0 8px 20px rgba(23,69,143,.4);}
  .btn.gold{background:linear-gradient(135deg, var(--rotary-gold-light) 0%, var(--rotary-gold) 100%); color:#14101A; box-shadow:0 4px 14px rgba(247,168,27,.3);}
  .btn.gold:hover{box-shadow:0 8px 20px rgba(247,168,27,.4);}
  .btn.ghost{background:transparent; color:var(--rotaract-cranberry); border:1.5px solid var(--line-strong); box-shadow:none;}
  .btn.ghost:hover{background:var(--rotaract-cranberry-soft); border-color:var(--rotaract-cranberry); box-shadow:0 4px 12px rgba(212,19,103,.15);}
  .btn.small{padding:9px 15px; font-size:13px; border-radius:11px; gap:7px;}
  .btn.icon-only{padding:9px; background:transparent; color:var(--ink-faint); box-shadow:none; border-radius:10px; position:relative;}
  .btn.icon-only::before{display:none;}
  .btn.icon-only:hover{color:var(--rotaract-cranberry); background:var(--paper); transform:scale(1.05);}
  .btn.icon-only:active{transform:scale(.92);}
  .btn.icon-only svg{width:16px; height:16px; position:static;}
  .badge{font-size:11.5px; font-weight:800; padding:4px 11px; border-radius:100px; white-space:nowrap; letter-spacing:0.02em;}
  .badge.ok{background:var(--ok-soft); color:var(--ok);}
  .badge.warn{background:var(--warn-soft); color:var(--warn);}
  .badge.error{background:var(--error-soft); color:var(--error);}
  .badge.info{background:#EFF8FF; color:#175CD3;}
  .badge.neutral{background:var(--paper); color:var(--ink-soft);}.list{display:flex; flex-direction:column; gap:10px;}
  .list-row{display:flex; gap:13px; align-items:center; background:var(--paper-raised); border-radius:12px; padding:15px 16px; border:1px solid var(--line); box-shadow:var(--shadow-xs); position:relative; transition:all .2s cubic-bezier(.16,1,.3,1); overflow:hidden;}
  .list-row:hover{box-shadow:var(--shadow-sm); transform:translateX(2px);}
  .list-row::before{content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:0 3px 3px 0; background:var(--rotaract-cranberry); transition:all .25s ease;}
  .list-row.status-termine::before, .list-row.status-atteint::before, .list-row.status-confirme::before{background:var(--ok);}
  .list-row.status-attente::before, .list-row.status-en_cours::before{background:var(--warn);}
  .list-row.status-a_faire::before, .list-row.status-a_initier::before, .list-row.status-planifie::before{background:var(--ink-faint);}
  .list-row.urgent::before{background:var(--warn) !important;}
  .list-row.overdue::before{background:var(--error) !important;}
  .list-row.priority{box-shadow:0 0 0 1.5px rgba(247,168,27,.4), 0 4px 16px rgba(247,168,27,.15);}
  .list-row.priority::before{background:var(--rotary-gold) !important;}
  .list-row .main-col{flex:1; min-width:0;}
  .list-row .title{font-size:14.5px; font-weight:800; color:var(--ink); letter-spacing:-0.005em; line-height:1.35;}
  .list-row .meta{font-size:12.5px; color:var(--ink-faint); margin-top:4px; line-height:1.4; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  select.statut-select{width:auto; padding:7px 11px; font-size:12px; font-weight:700; border-radius:100px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; transition:all .15s ease;}
  select.statut-select:hover{border-color:var(--rotaract-cranberry);}
  .empty{padding:36px 12px; color:var(--ink-faint); font-size:13.5px; text-align:center; font-style:italic; line-height:1.6;}
  .note{font-size:12.5px; color:var(--warn); margin-top:8px;}
  .note.muted{color:var(--ink-faint); font-style:italic;}
  .add-form{display:flex; gap:9px; flex-wrap:wrap; margin-top:18px; padding-top:18px; border-top:1.5px dashed var(--line);}
  .add-form input, .add-form select{flex:1; min-width:120px;}
  .stat-row{display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin:22px 0;}
  .stat{background:var(--paper-raised); border-radius:14px; padding:18px 16px; box-shadow:var(--shadow-sm); border:1px solid var(--line); position:relative; overflow:hidden; transition:all .22s cubic-bezier(.16,1,.3,1);}
  .stat:hover{transform:translateY(-2px); box-shadow:var(--shadow-md);}
  .stat::before{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, var(--rotaract-cranberry), var(--rotary-gold));}
  .stat.blue::before{background:linear-gradient(90deg, var(--rotary-blue), var(--royal-azure));}
  .stat.gold::before{background:linear-gradient(90deg, var(--rotary-gold), var(--rotary-gold-light));}
  .stat.ok::before{background:linear-gradient(90deg, var(--ok), #22C55E);}
  .stat .num{font-family:var(--font-display); font-size:28px; font-weight:700; color:var(--ink); line-height:1; margin-bottom:8px; letter-spacing:-0.03em;}
  .stat.blue .num{color:var(--rotary-blue);}
  .stat.gold .num{color:var(--rotary-gold);}
  .stat.ok .num{color:var(--ok);}
  .stat .lbl{font-size:11px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:0.08em; line-height:1.3;}
  .stat .icon-mini{position:absolute; top:14px; right:14px; width:24px; height:24px; color:var(--ink-faint); opacity:.35;}
  .callout{background:linear-gradient(135deg, var(--paper-warm) 0%, var(--paper-raised) 100%); border-radius:var(--radius); padding:22px; margin-top:20px; border-left:4px solid var(--rotary-gold); box-shadow:var(--shadow-sm);}
  .callout h3{font-size:16px; margin-bottom:7px; color:var(--rotary-blue); letter-spacing:-0.01em;}
  .callout p{font-size:13.5px; color:var(--ink-soft); margin-bottom:14px; line-height:1.55;}
  .quick-actions{display:flex; gap:9px; flex-wrap:wrap; margin-top:20px;}
  .filters-bar{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:16px; padding:12px 14px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-xs);}
  .filter-group{display:flex; gap:7px; flex-wrap:wrap; flex:1; min-width:0;}
  .filter-chip{padding:7px 13px; font-size:12.5px; font-weight:700; background:var(--paper); color:var(--ink-soft); border:1.5px solid transparent; border-radius:100px; transition:all .18s ease; white-space:nowrap; letter-spacing:0.01em;}
  .filter-chip:hover{background:var(--paper-warm); color:var(--rotaract-cranberry);}
  .filter-chip.active{background:linear-gradient(135deg, var(--rotaract-cranberry-light), var(--rotaract-cranberry)); color:#fff; box-shadow:0 4px 12px rgba(212,19,103,.3);}
  .filter-chip:active{transform:scale(.95);}
  .sort-select{padding:8px 11px; font-size:12.5px; font-weight:700; background:var(--paper); color:var(--rotaract-cranberry); border:1.5px solid var(--line); border-radius:10px; width:auto; max-width:170px; cursor:pointer; transition:all .15s ease;}
  .sort-select:hover{border-color:var(--rotaract-cranberry);}
  .task-count{font-size:12.5px; color:var(--ink-faint); font-weight:700; margin-left:auto; white-space:nowrap;}
  .star-btn{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:transparent; color:var(--ink-faint); flex-shrink:0; transition:all .18s cubic-bezier(.16,1,.3,1);}
  .star-btn svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.8;}
  .star-btn:hover{background:var(--paper-warm); color:var(--rotary-gold); transform:scale(1.1);}
  .star-btn:active{transform:scale(.82);}
  .star-btn.active{color:var(--rotary-gold);}
  .star-btn.active svg{fill:var(--rotary-gold); stroke:var(--rotary-gold);}
  .search-bar{display:flex; gap:10px; align-items:center; background:var(--paper-raised); border:1.5px solid var(--line); border-radius:var(--radius); padding:12px 16px; margin-bottom:20px; box-shadow:var(--shadow-xs); transition:all .2s ease;}
  .search-bar:focus-within{border-color:var(--rotaract-cranberry); box-shadow:var(--shadow-focus);}
  .search-bar input{border:none; padding:4px 0; background:transparent; font-size:14px;}
  .search-bar input:focus{outline:none; box-shadow:none;}
  .search-bar svg{width:19px; height:19px; color:var(--ink-faint); flex-shrink:0;}
  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(120px); background:var(--rotary-blue); color:#fff; padding:14px 24px; border-radius:100px; font-size:13.5px; font-weight:700; opacity:0; transition:all .35s cubic-bezier(.16,1,.3,1); z-index:9999; box-shadow:0 10px 32px rgba(23,69,143,.5); pointer-events:none; max-width:90vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .footer-sig{margin-top:38px; padding-top:20px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-faint); text-align:center; line-height:1.6;}
  .footer-sig strong{color:var(--rotaract-cranberry); font-weight:800;}
  .progress-track{height:8px; background:var(--paper); border-radius:100px; overflow:hidden; margin-top:8px;}

function createStore(name, seed){
  const saved = lsGet(name, null);
  const items = (saved && Array.isArray(saved)) ? saved : seed.map(x => Object.assign({id:uid()}, x));
  if(!saved) lsSet(name, items);
  stores[name] = {
    items: items,
    add(data){ const item = Object.assign({id:uid()}, data); this.items.push(item); this._save(); renderActivePanel(); renderDashboardStats(); },
    updateItem(id, patch){ const it = this.items.find(i => i.id === id); if(it){ Object.assign(it, patch); this._save(); renderActivePanel(); renderDashboardStats(); } },
    removeItem(id){ this.items = this.items.filter(i => i.id !== id); this._save(); renderActivePanel(); renderDashboardStats(); },
    _save(){ lsSet(name, this.items); }
  };
