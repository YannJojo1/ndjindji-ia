<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17458F">
<title>Ndjindji IA — Assistant du Président</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --framboise:#D41367;
    --framboise-dark:#A80E52;
    --framboise-soft:#FCE8F1;
    --framboise-tint:#FEF4F9;
    --paper:#FAF7F9;
    --paper-raised:#FFFFFF;
    --ink:#1A1520;
    --ink-soft:#5B4A56;
    --ink-faint:#958A94;
    --line:#F0E4EB;
    --radius:16px;
    --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(212,19,103,.06), 0 2px 8px rgba(212,19,103,.05);
    --shadow-md:0 2px 6px rgba(212,19,103,.08), 0 8px 24px rgba(212,19,103,.08);
    --shadow-lg:0 4px 12px rgba(212,19,103,.1), 0 16px 40px rgba(212,19,103,.1);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --ok:#2E7D5B;
    --ok-soft:#E1F1EA;
    --warn:#B4590E;
    --warn-soft:#FBEADA;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1A1520;
      --paper-raised:#221A26;
      --ink:#F5EEF2;
      --ink-soft:#C8B8C2;
      --ink-faint:#8A7B86;
      --framboise-soft:#3A1828;
      --framboise-tint:#2A121E;
      --line:#332430;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.2);
      --shadow-md:0 2px 6px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
      --shadow-lg:0 4px 12px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0; letter-spacing:-0.02em;}
  h1{font-family:var(--font-display); font-weight:700; font-size:28px; color:var(--ink);}
  h2{font-family:var(--font-display); font-weight:700; font-size:22px;}
  h3{font-family:var(--font-body); font-weight:700; font-size:16px;}
  p{margin:0 0 .7em;}
  button{font-family:var(--font-body); cursor:pointer; border:none; background:none; padding:0;}
  input,select,textarea{font-family:var(--font-body); font-size:15px; color:var(--ink); background:var(--paper-raised); border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; width:100%; transition:border-color .15s;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--framboise);}
  label{display:block; font-size:13px; color:var(--ink-soft); margin:0 0 6px; font-weight:600;}
  .shell{display:flex; flex-direction:column; min-height:100vh;}
  .field{margin-bottom:14px;}/* ---------- NAVIGATION / RAIL ---------- */
  nav.rail{
    display:flex; flex-direction:column;
    background:var(--paper-raised);
    border-bottom:1px solid var(--line);
    padding:14px 16px 0;
    flex-shrink:0;
    box-shadow:var(--shadow-sm);
    position:relative;
  }
  .brand{padding:0 0 14px;}
  .brand-logo{
    background:linear-gradient(135deg, var(--framboise) 0%, var(--framboise-dark) 100%);
    border-radius:12px;
    padding:10px 14px;
    display:inline-block;
    max-width:220px;
    margin-bottom:12px;
    box-shadow:0 4px 12px rgba(212,19,103,.25);
  }
  .brand-logo img{display:block; width:100%; height:auto; filter:brightness(0) invert(1);}
  .brand .word{
    font-family:var(--font-body);
    font-style:normal;
    font-weight:800;
    font-size:22px;
    color:var(--framboise);
    line-height:1;
    letter-spacing:-0.5px;
  }
  .brand .sub{font-size:12px; color:var(--ink-faint); margin-top:5px; line-height:1.4; font-weight:500;}
  .brand .motto{font-size:11.5px; color:var(--framboise); margin-top:8px; font-style:italic; font-weight:600;}
  .lang-switch{display:flex; gap:6px; margin-bottom:12px; padding:0; max-width:240px;}
  .lang-btn{
    flex:1; padding:7px 10px; font-size:12px; font-weight:600;
    background:var(--framboise-tint); border:1px solid var(--line);
    color:var(--ink-soft); border-radius:8px;
    transition:all .15s;
  }
  .lang-btn.active{background:var(--framboise); color:#fff; border-color:var(--framboise);}
  .theme-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--framboise-tint); border:1px solid var(--line);
    color:var(--framboise); padding:7px 12px; border-radius:8px;
    font-size:12px; font-weight:600; margin:0 0 12px;
    max-width:240px;
  }
  .theme-btn svg{width:14px; height:14px;}
  .navrow{
    display:flex; overflow-x:auto; gap:4px;
    padding-bottom:0;
    -ms-overflow-style:none; scrollbar-width:none;
    margin:0 -16px; padding-left:16px; padding-right:16px;
  }
  .navrow::-webkit-scrollbar{display:none;}
  .navbtn{
    display:flex; align-items:center; gap:8px; white-space:nowrap;
    background:transparent; border:none;
    color:var(--ink-soft);
    padding:11px 14px;
    border-radius:10px 10px 0 0;
    font-size:13.5px; font-weight:600;
    flex-shrink:0;
    position:relative;
    transition:color .15s;
  }
  .navbtn svg{width:16px; height:16px; opacity:.7; flex-shrink:0;}
  .navbtn.active{color:var(--framboise); background:var(--framboise-tint);}
  .navbtn.active svg{opacity:1;}
  .navbtn.active::after{
    content:"";
    position:absolute; left:14px; right:14px; bottom:0;
    height:3px; background:var(--framboise);
    border-radius:3px 3px 0 0;
  }
  .navbtn:hover{color:var(--framboise);}

  /* ---------- MAIN ---------- */
  main{flex:1; min-width:0; padding:20px 16px 60px; max-width:900px; margin:0 auto; width:100%;}
  .panel{display:none;}
  .panel.active{display:block; animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .panel-head{margin-bottom:20px;}
  .panel-head h1{font-size:26px; color:var(--ink);}
  .panel-head p{color:var(--ink-soft); font-size:14px; margin-top:6px; max-width:60ch;}
  .divider{border:none; border-top:1px solid var(--line); margin:22px 0;}

  /* ---------- CARTES ---------- */
  .card{
    background:var(--paper-raised);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
    box-shadow:var(--shadow-sm);
    border:1px solid var(--line);
    transition:box-shadow .2s;
  }
  .section-title{font-size:15px; font-weight:700; color:var(--ink); margin-bottom:4px;}
  .section-sub{font-size:12.5px; color:var(--ink-faint); margin-bottom:14px;}

  /* ---------- FORMULAIRES ---------- */
  .row{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;}
  .row > *{flex:1; min-width:140px;}

  /* ---------- BOUTONS ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
    padding:12px 18px;
    border-radius:12px;
    font-size:14px; font-weight:700;
    background:var(--framboise); color:#fff;
    box-shadow:0 4px 12px rgba(212,19,103,.25);
    transition:transform .12s, box-shadow .2s;
  }
  .btn:active{transform:scale(.97);}
  .btn svg{width:16px; height:16px;}
  .btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none;}
  .btn.primary{background:var(--framboise);}
  .btn.ghost{
    background:transparent; color:var(--framboise);
    border:1.5px solid var(--framboise-soft);
    box-shadow:none;
  }
  .btn.small{padding:9px 14px; font-size:13px;}
  .btn.icon-only{
    padding:8px; background:transparent; color:var(--ink-faint);
    box-shadow:none; border-radius:8px;
  }
  .btn.icon-only:hover{color:var(--framboise); background:var(--framboise-tint);}
  .btn.icon-only svg{width:16px; height:16px;}/* ---------- LISTES ---------- */
  .list{display:flex; flex-direction:column; gap:10px;}
  .list-row{
    display:flex; gap:12px; align-items:center;
    background:var(--paper-raised);
    border-radius:12px;
    padding:14px 14px 14px 16px;
    border:1px solid var(--line);
    box-shadow:var(--shadow-sm);
    position:relative;
  }
  .list-row::before{
    content:"";
    position:absolute; left:0; top:16px; bottom:16px;
    width:3px; border-radius:0 3px 3px 0;
    background:var(--framboise);
  }
  .list-row.status-termine::before,
  .list-row.status-atteint::before,
  .list-row.status-confirme::before{background:var(--ok);}
  .list-row.status-attente::before,
  .list-row.status-en_cours::before{background:#F5A623;}
  .list-row.status-a_faire::before,
  .list-row.status-a_initier::before,
  .list-row.status-planifie::before{background:var(--ink-faint);}.list-row.urgent::before{background:#F5A623 !important;}
  .list-row.overdue::before{background:#DC2626 !important;}
  .list-row.urgent{background:linear-gradient(90deg, #FFF8E7 0%, var(--paper-raised) 40%);}
  .list-row.overdue{background:linear-gradient(90deg, #FEE2E2 0%, var(--paper-raised) 40%);}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .list-row.urgent{background:linear-gradient(90deg, #3A2A0F 0%, var(--paper-raised) 40%);}
    :root:not([data-theme="light"]) .list-row.overdue{background:linear-gradient(90deg, #3A1414 0%, var(--paper-raised) 40%);}
  }
  :root[data-theme="dark"] .list-row.urgent{background:linear-gradient(90deg, #3A2A0F 0%, var(--paper-raised) 40%);}
  :root[data-theme="dark"] .list-row.overdue{background:linear-gradient(90deg, #3A1414 0%, var(--paper-raised) 40%);}
  .badge.urgent{background:#FFF3E0; color:#B4590E;}
  .badge.overdue{background:#FEE2E2; color:#991B1B;}
  .alert-banner{
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
    border:1px solid #F5A623;
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:16px;
    color:#78350F;
    font-size:14px;
    font-weight:600;
    animation:fadeIn .3s ease;
  }
  .alert-banner.overdue{
    background:linear-gradient(135deg, #FEE2E2 0%, #FECACA 100%);
    border-color:#DC2626;
    color:#7F1D1D;
  }
  .alert-banner svg{width:22px; height:22px; flex-shrink:0;}
  .alert-banner .alert-text{flex:1; line-height:1.4;}
  .alert-banner .alert-text strong{display:block; font-size:14.5px; margin-bottom:2px;}
  .alert-banner .alert-text small{font-size:12.5px; opacity:.85; font-weight:500;}
  .alert-banner button{
    background:rgba(255,255,255,.6); color:inherit;
    padding:6px 12px; border-radius:8px;
    font-size:12px; font-weight:700;
    border:none;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .alert-banner{
      background:linear-gradient(135deg, #3A2A0F 0%, #4A3614 100%);
      color:#FDE68A;
      border-color:#B4590E;
    }
    :root:not([data-theme="light"]) .alert-banner.overdue{
      background:linear-gradient(135deg, #3A1414 0%, #4A1A1A 100%);
      color:#FCA5A5;
      border-color:#DC2626;
    }
  }
  :root[data-theme="dark"] .alert-banner{
    background:linear-gradient(135deg, #3A2A0F 0%, #4A3614 100%);
    color:#FDE68A;
    border-color:#B4590E;
  }
  :root[data-theme="dark"] .alert-banner.overdue{
    background:linear-gradient(135deg, #3A1414 0%, #4A1A1A 100%);
    color:#FCA5A5;
    border-color:#DC2626;
  }
  .list-row .main-col{flex:1; min-width:0;}
  .list-row .title{font-size:14.5px; font-weight:700; color:var(--ink);}
  .list-row .meta{font-size:12.5px; color:var(--ink-faint); margin-top:3px;}

  /* ---------- BADGES / SELECT ---------- */
  .badge{font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:100px; white-space:nowrap;}
  .badge.a_faire, .badge.a_initier, .badge.planifie{background:var(--line); color:var(--ink-soft);}
  .badge.en_cours{background:#FFF3E0; color:var(--warn);}
  .badge.termine, .badge.atteint, .badge.confirme{background:var(--ok-soft); color:var(--ok);}
  .badge.attente{background:var(--warn-soft); color:var(--warn);}
  select.statut-select{
    width:auto; padding:6px 10px; font-size:12px; font-weight:600;
    border-radius:100px; border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
  }

  /* ---------- ÉTATS VIDES / NOTES ---------- */
  .empty{padding:26px 4px; color:var(--ink-faint); font-size:13.5px; text-align:center; font-style:italic;}
  .note{font-size:12.5px; color:var(--warn); margin-top:8px;}
  .note.muted{color:var(--ink-faint); font-style:italic;}
  .check{margin:2px 0 16px; display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-soft);}
  .check input{width:auto;}

  /* ---------- FORMULAIRE AJOUT ---------- */
  .add-form{
    display:flex; gap:8px; flex-wrap:wrap;
    margin-top:16px; padding-top:16px;
    border-top:1px dashed var(--line);
  }
  .add-form input, .add-form select{flex:1; min-width:120px;}

  /* ---------- STATS ---------- */
  .stat-row{
    display:grid; grid-template-columns:repeat(2, 1fr);
    gap:10px; margin:20px 0;
  }
  @media (min-width:600px){
    .stat-row{grid-template-columns:repeat(4, 1fr);}
  }
  .stat{
    background:var(--paper-raised);
    border-radius:var(--radius);
    padding:14px;
    box-shadow:var(--shadow-sm);
    border:1px solid var(--line);
    position:relative; overflow:hidden;
  }
  .stat::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--framboise), var(--framboise-dark));
  }
  .stat .num{
    font-family:var(--font-display);
    font-size:24px; font-weight:700;
    color:var(--framboise);
    line-height:1; margin-bottom:6px;
  }
  .stat .lbl{font-size:11px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:0.3px;}

  /* ---------- CALLOUT ---------- */
  .callout{
    background:var(--framboise-tint);
    border-radius:var(--radius);
    padding:20px; margin-top:18px;
    border-left:4px solid var(--framboise);
  }
  .callout h3{font-size:16px; margin-bottom:6px; color:var(--framboise);}
  .callout p{font-size:13.5px; color:var(--ink-soft); margin-bottom:12px;}
  .quick-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:22px;}

  /* ---------- OUTPUT / DOCUMENTS ---------- */
  .output-box{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px; min-height:120px;
    font-size:14px; white-space:pre-wrap; line-height:1.6;
    color:var(--ink);
  }
  .output-box.placeholder{color:var(--ink-faint); font-style:italic;}
  .output-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}

  /* ---------- PROGRESS ---------- */
  .progress-track{
    height:8px; background:var(--framboise-soft);
    border-radius:100px; overflow:hidden; margin-top:8px;
  }
  .progress-fill{
    height:100%; border-radius:100px;
    background:linear-gradient(90deg, var(--framboise), var(--framboise-dark));
    transition:width .4s ease;
  }

  /* ---------- AVATAR VOCAL ---------- */
  .avatar-holder{position:relative; width:130px; height:130px; margin:8px auto 12px;}
  .avatar-holder svg{width:100%; height:100%; display:block;}
  .avatar-ring{fill:none; stroke:var(--framboise); stroke-width:4; opacity:0; transform-origin:100px 100px;}
  .avatar-holder.state-listening .avatar-ring{stroke:var(--framboise); opacity:.55; animation:ringPulse 1.4s ease-in-out infinite;}
  .avatar-holder.state-speaking .avatar-ring{stroke:var(--framboise); opacity:.6; animation:ringPulse 0.9s ease-in-out infinite;}
  @keyframes ringPulse{0%{transform:scale(.94); opacity:.7;}50%{transform:scale(1.06); opacity:.2;}100%{transform:scale(.94); opacity:.7;}}
  .avatar-eye{fill:#fff; transition:transform .12s ease; transform-origin:center;}
  .avatar-holder.blink .avatar-eye{transform:scaleY(0.12);}
  .avatar-mouth{fill:#fff; transform-origin:100px 128px; transition:transform .08s ease;}
  .avatar-holder.mouth-open .avatar-mouth{transform:scaleY(3);}
  .voice-status{font-size:13px; color:var(--ink-soft); min-height:18px; margin-bottom:14px; text-align:center;}
  .voice-controls{display:flex; align-items:center; gap:12px; justify-content:center; margin-bottom:20px; flex-wrap:wrap;}
  .mic-btn{
    width:64px; height:64px; border-radius:50%;
    background:linear-gradient(135deg, var(--framboise), var(--framboise-dark));
    color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(212,19,103,.35);
    transition:transform .15s;
  }
  .mic-btn:active{transform:scale(.92);}
  .mic-btn svg{width:26px; height:26px;}
  .mic-btn.listening{animation:pulseMic 1.2s infinite;}
  @keyframes pulseMic{0%,100%{box-shadow:0 8px 24px rgba(212,19,103,.35);}50%{box-shadow:0 8px 32px rgba(212,19,103,.65);}}

  /* ---------- CHAT ---------- */
  .chat-wrap{
    display:flex; flex-direction:column; gap:10px;
    padding:14px;
    background:var(--framboise-tint);
    border-radius:var(--radius);
    max-height:360px; overflow-y:auto;
    margin-bottom:14px;
  }
  .chat-msg{padding:11px 15px; font-size:14px; line-height:1.5; max-width:85%; border-radius:16px;}
  .chat-msg.user{
    align-self:flex-end;
    background:var(--framboise); color:#fff;
    border-radius:16px 16px 4px 16px;
    box-shadow:0 4px 12px rgba(212,19,103,.2);
  }
  .chat-msg.bot{
    align-self:flex-start;
    background:var(--paper-raised); color:var(--ink);
    border-radius:16px 16px 16px 4px;
    box-shadow:var(--shadow-sm);
  }
  .chat-input{display:flex; gap:8px;}

  /* ---------- RECHERCHE ---------- */
  .search-bar{
    display:flex; gap:8px; align-items:center;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 14px; margin-bottom:18px;
    box-shadow:var(--shadow-sm);
  }
  .search-bar input{border:none; padding:4px 0; background:transparent; font-size:14px;}
  .search-bar input:focus{outline:none;}
  .search-bar svg{width:18px; height:18px; color:var(--ink-faint); flex-shrink:0;}

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(100px);
    background:var(--framboise); color:#fff;
    padding:12px 22px; border-radius:100px;
    font-size:13.5px; font-weight:600;
    opacity:0; transition:all .3s ease;
    z-index:9999;
    box-shadow:0 8px 24px rgba(212,19,103,.4);
    pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- FOOTER ---------- */
  .footer-sig{
    margin-top:34px; padding-top:16px;
    border-top:1px solid var(--line);
    font-size:12px; color:var(--ink-faint);
    text-align:center;
  }
  .footer-sig strong{color:var(--framboise);}

  /* ---------- RESPONSIVE DESKTOP ---------- */
  @media (min-width:860px){
    .shell{flex-direction:row;}
    nav.rail{
      width:260px;
      min-height:100vh;
      border-bottom:none;
      border-right:1px solid var(--line);
      padding:22px 16px;
    }
    .navrow{flex-direction:column; overflow-x:visible; margin:0; padding:0; gap:4px;}
    .navbtn{
      width:100%; border-radius:10px;
      padding:11px 14px;
    }
    .navbtn.active::after{display:none;}
    .navbtn.active{background:var(--framboise-soft);}
    main{padding:32px 40px 80px;}
  }
</style>
</head><body>
<div class="shell">
  <nav class="rail">
    <div class="brand">
      <div class="brand-logo" id="brandLogo">
        <div style="text-align:center;font-weight:700;color:#17458F;font-size:15px;">ROTARACT</div>
        <div style="text-align:center;font-size:11px;color:#D41367;font-weight:600;margin-top:2px;">Club Ndjindji</div>
      </div>

/* ---------------------------------------------------------------
   DÉTECTION DES URGENCES ET RETARDS
--------------------------------------------------------------- */
function getUrgencyInfo(echeance, statut){
  if(!echeance) return {level:"none"};
  if(statut === "termine" || statut === "atteinte") return {level:"done"};
  
  const today = new Date();
  today.setHours(0,0,0,0);
  const due = new Date(echeance + "T00:00:00");
  if(isNaN(due)) return {level:"none"};
  
  const diffDays = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
  
  if(diffDays < 0) return {level:"overdue", days:Math.abs(diffDays)};
  if(diffDays === 0) return {level:"urgent", days:0, label:"aujourd'hui"};
  if(diffDays === 1) return {level:"urgent", days:1, label:"demain"};
  if(diffDays <= 3) return {level:"urgent", days:diffDays};
  return {level:"ok", days:diffDays};
}

function getUrgencyClass(echeance, statut){
  const info = getUrgencyInfo(echeance, statut);
  if(info.level === "overdue") return "overdue";
  if(info.level === "urgent") return "urgent";
  return "";
}

function getUrgencyBadge(echeance, statut){
  const info = getUrgencyInfo(echeance, statut);
  if(info.level === "overdue"){
    return '<span class="badge overdue">⚠️ ' + (currentLang === "fr" ? "Retard " + info.days + "j" : info.days + "d late") + '</span>';
  }
  if(info.level === "urgent"){
    let lbl;
    if(info.label) lbl = info.label;
    else lbl = currentLang === "fr" ? "dans " + info.days + "j" : "in " + info.days + "d";
    return '<span class="badge urgent">⚡ ' + lbl + '</span>';
  }
  return "";
}

function countUrgentTasks(){
  let overdue = 0, urgent = 0;
  stores.taches.items.forEach(function(t){
    const info = getUrgencyInfo(t.echeance, t.statut);
    if(info.level === "overdue") overdue++;
    else if(info.level === "urgent") urgent++;
  });
  return {overdue:overdue, urgent:urgent};
}

const STORAGE_PREFIX = "ndjindji_v2_";

function lsGet(key, fallback){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    if(raw === null) return fallback;
    return JSON.parse(raw);
  }catch(e){
    console.error("lsGet", key, e);
    return fallback;
  }
}

function lsSet(key, value){
  try{
    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
    return true;
  }catch(e){
    console.error("lsSet", key, e);
    toast("Erreur de sauvegarde — vérifie l'espace disponible");
    return false;
  }
}

const stores = {};

function createStore(name, seed){
  const saved = lsGet(name, null);
  const items = (saved && Array.isArray(saved)) ? saved : seed.map(x => Object.assign({id:uid()}, x));
  if(!saved) lsSet(name, items);
  stores[name] = {
    items: items,
    add(data){
      const item = Object.assign({id:uid()}, data);
      this.items.push(item);
      this._save();
      renderActivePanel();
      renderDashboardStats();
      updateGlobalSearch();
    },
    updateItem(id, patch){
      const it = this.items.find(i => i.id === id);
      if(it){
        Object.assign(it, patch);
        this._save();
        renderActivePanel();
        renderDashboardStats();
      }
    },
    removeItem(id){
      this.items = this.items.filter(i => i.id !== id);
      this._save();
      renderActivePanel();
      renderDashboardStats();
      updateGlobalSearch();
    },
    _save(){ lsSet(name, this.items); }
  };
}

function initStores(){
  createStore("taches", SEED_TACHES);

function updateGlobalSearch(){

  if(!input || !results) return;

  if(!q){ results.innerHTML = ""; return; }

  const hits = [];
  ["taches","projets","evenements","membres","partenaires","objectifs"].forEach(function(storeName){

      const text = JSON.stringify(item).toLowerCase();

function exportData(){
  const data = {};
  Object.keys(stores).forEach(function(k){ data[k] = stores[k].items; });
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ndjindji-donnees-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(t("toastExporte"));
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      Object.keys(data).forEach(function(k){
        if(stores[k] && Array.isArray(data[k])){
          stores[k].items = data[k];
          stores[k]._save();
        }
      });
      renderShell();
      renderDashboardStats();
      toast(t("toastImporte"));
    }catch(err){
      toast("Erreur : fichier invalide");
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}/* ---------------------------------------------------------------

let recognition = null;
let recognizing = false;
let mouthTimer = null;
let blinkTimer = null;
let sttSupported = false;
let ttsSupported = false;
let voiceEngineReady = false;

function initVoiceEngine(){
  if(voiceEngineReady) return;
  voiceEngineReady = true;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  sttSupported = !!SR;
  ttsSupported = !!window.speechSynthesis;

  const micBtn = $("#micBtn");
  if(!micBtn) return;

  if(!sttSupported){
    micBtn.style.opacity = "0.4";
    micBtn.title = currentLang === "fr" ? "Reconnaissance vocale non disponible" : "Voice recognition unavailable";
    return;
  }

  recognition = new SR();
  recognition.lang = currentLang === "fr" ? "fr-FR" : "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function(){
    recognizing = true;
    micBtn.classList.add("listening");
    setAvatarState("listening");
    setVoiceStatus(currentLang === "fr" ? "Je vous écoute..." : "Listening...");
  };

  recognition.onerror = function(){
    recognizing = false;
    micBtn.classList.remove("listening");
    setAvatarState(null);
    setVoiceStatus(currentLang === "fr" ? "Touchez le micro pour parler." : "Tap the mic to speak.");
  };

  recognition.onend = function(){
    recognizing = false;
    micBtn.classList.remove("listening");
    if(!mouthTimer) setAvatarState(null);
  };

  recognition.onresult = function(event){
    const text = event.results[0][0].transcript;
    if(text && text.trim()){
      const input = $("#chatInput");
      if(input){ input.value = text.trim(); sendChat(); }
      setTimeout(function(){ speakLastBotMessage(); }, 600);
    }
  };

  micBtn.addEventListener("click", function(){
    if(recognizing){ recognition.stop(); return; }
    try{ recognition.start(); }catch(e){}
  });

  startBlinking();
}

function setAvatarState(state){
  const el = $("#avatarHolder");
  if(!el) return;
  el.classList.remove("state-listening", "state-speaking");
  if(state) el.classList.add("state-" + state);
}

function setVoiceStatus(text){
  const el = $("#voiceStatus");
  if(el) el.textContent = text;
}

function startMouthAnim(){
  const el = $("#avatarHolder");
  if(!el) return;
  stopMouthAnim();
  mouthTimer = setInterval(function(){
    el.classList.toggle("mouth-open");
  }, 110 + Math.random() * 90);
}

function stopMouthAnim(){
  if(mouthTimer){ clearInterval(mouthTimer); mouthTimer = null; }
  const el = $("#avatarHolder");
  if(el) el.classList.remove("mouth-open");
}

function startBlinking(){
  if(blinkTimer) return;
  blinkTimer = setInterval(function(){
    const el = $("#avatarHolder");
    if(!el) return;
    el.classList.add("blink");
    setTimeout(function(){ el.classList.remove("blink"); }, 130);
  }, 3200 + Math.random() * 2200);
}

function speakLastBotMessage(){
  if(!ttsSupported) return;
  const last = chatHistory.filter(function(m){ return m.from === "bot"; }).slice(-1)[0];
  if(!last) return;
  speak(last.text);
}

function speak(text){
  if(!ttsSupported || !text) return;
  try{
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = currentLang === "fr" ? "fr-FR" : "en-US";
    utt.rate = 1;
    const voices = window.speechSynthesis.getVoices();
    const target = currentLang === "fr" ? "fr" : "en";
    const v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf(target) === 0; });
    if(v) utt.voice = v;
    utt.onstart = function(){ setAvatarState("speaking"); startMouthAnim(); };
    utt.onend = function(){ stopMouthAnim(); setAvatarState(null); setVoiceStatus(currentLang === "fr" ? "Touchez le micro pour parler." : "Tap the mic to speak."); };
    utt.onerror = function(){ stopMouthAnim(); setAvatarState(null); };
    window.speechSynthesis.speak(utt);
  }catch(e){}
}

/* ---------------------------------------------------------------
   MOTEUR DE COMMANDES DE L'ASSISTANT
--------------------------------------------------------------- */
function processCommand(text){
  const q = text.toLowerCase().trim();
  const fr = currentLang === "fr";

  // Aide
  if(q.indexOf("aide") >= 0 || q.indexOf("help") >= 0){
    return fr
      ? "Voici ce que je peux faire :\n\n• Ajouter une tâche : « Ajouter une tâche »\n• Voir mes tâches : « Voir mes tâches »\n• Prochain événement : « Prochain événement »\n• Voir mes projets : « Mes projets »\n• Statistiques : « Statistiques »\n• Nombre de membres : « Membres »\n\nToutes ces commandes sont aussi disponibles en anglais."
      : "Here is what I can do:\n\n• Add a task: \"Add a task\"\n• See my tasks: \"See my tasks\"\n• Next event: \"Next event\"\n• See my projects: \"My projects\"\n• Statistics: \"Statistics\"\n• Number of members: \"Members\"\n\nAll commands are also available in French.";
  }

  // Tâches
  if(q.indexOf("tâche") >= 0 || q.indexOf("task") >= 0){
    if(q.indexOf("ajout") >= 0 || q.indexOf("add") >= 0 || q.indexOf("nouveau") >= 0 || q.indexOf("new") >= 0){
      setActiveTab("taches");
      return fr ? "Direction l'onglet Tâches — vous pouvez y ajouter votre tâche en bas du formulaire." : "Going to the Tasks tab — you can add your task at the bottom of the form.";
    }
    const actives = stores.taches.items.filter(function(x){ return x.statut !== "termine"; });
    if(!actives.length) return fr ? "Toutes vos tâches sont terminées. Bravo !" : "All your tasks are done. Well done!";
    let r = fr ? "Vous avez " + actives.length + " tâche(s) en cours :\n\n" : "You have " + actives.length + " active task(s):\n\n";
    actives.slice(0,8).forEach(function(x, i){
      r += (i+1) + ". " + x.titre + (x.responsable ? " — " + x.responsable : "") + (x.echeance ? " (" + fmtDate(x.echeance) + ")" : "") + "\n";
    });
    return r;
  }

  // Événement
  if(q.indexOf("événement") >= 0 || q.indexOf("event") >= 0){
    const evts = stores.evenements.items.slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
    if(!evts.length) return fr ? "Aucun événement planifié pour l'instant." : "No event planned yet.";
    const next = evts[0];
    return fr
      ? "Prochain événement : " + next.titre + "\nDate : " + fmtDate(next.date) + (next.lieu ? "\nLieu : " + next.lieu : "") + (next.notes ? "\nNotes : " + next.notes : "")
      : "Next event: " + next.titre + "\nDate: " + fmtDate(next.date) + (next.lieu ? "\nLocation: " + next.lieu : "") + (next.notes ? "\nNotes: " + next.notes : "");
  }

  // Projets
  if(q.indexOf("projet") >= 0 || q.indexOf("project") >= 0){
    const p = stores.projets.items;
    if(!p.length) return fr ? "Aucun projet enregistré pour l'instant." : "No project registered yet.";
    let r = fr ? "Vos projets :\n\n" : "Your projects:\n\n";
    p.slice(0,8).forEach(function(x, i){ r += (i+1) + ". " + x.titre + (x.responsable ? " — " + x.responsable : "") + "\n"; });
    return r;
  }

  // Statistiques
  if(q.indexOf("statis") >= 0 || q.indexOf("stat") >= 0 || q.indexOf("chiffre") >= 0){
    const t = stores.taches.items.filter(function(x){ return x.statut !== "termine"; }).length;
    const p = stores.projets.items.length;
    const e = stores.evenements.items.length;
    const m = stores.membres.items.length;
    const objAtteints = stores.objectifs.items.filter(function(o){ return o.statut === "atteint"; }).length;
    return fr
      ? "Aperçu du club :\n\n• Tâches actives : " + t + "\n• Projets : " + p + "\n• Événements : " + e + "\n• Membres : " + m + "\n• Axes My Rotary atteints : " + objAtteints + " / " + stores.objectifs.items.length
      : "Club overview:\n\n• Active tasks: " + t + "\n• Projects: " + p + "\n• Events: " + e + "\n• Members: " + m + "\n• My Rotary areas achieved: " + objAtteints + " / " + stores.objectifs.items.length;
  }

  // Membres
  if(q.indexOf("membre") >= 0 || q.indexOf("member") >= 0){
    const m = stores.membres.items.filter(function(x){ return x.nom; });
    return fr
      ? "Le club compte " + m.length + " membre(s) enregistré(s). Consultez l'onglet Membres pour les détails."
      : "The club has " + m.length + " registered member(s). Check the Members tab for details.";
  }

  // Réponse par défaut
  return fr
    ? "Je n'ai pas compris cette commande. Tapez « Aide » pour voir la liste des commandes disponibles."
    : "I didn't understand that command. Type \"Help\" to see the list of available commands.";
}/* ---------------------------------------------------------------
   PANNEAU : TÂCHES
--------------------------------------------------------------- */

const OBJ_STATUTS = {a_initier:"statusAInitier", en_cours:"statusEnCours", atteint:"statusAtteint"};
const OBJ_COULEURS = ["--rotary-blue","--rotary-gold","--rotaract-cranberry","--royal-azure","--sky-blue","--vibrant-orange"];

function panelObjectifs(){
  return '' +
  '<section class="panel" data-panel="objectifs">' +
    '<div class="panel-head"><h1>' + esc(t("objectifsTitle")) + '</h1><p>' + esc(t("objectifsSub")) + '</p></div>' +

      '<div class="progress-track"><div class="progress-fill" id="objProgress" style="width:0%"></div></div>' +
      '<div class="section-sub" id="objProgressLabel" style="margin-top:8px"></div>' +
      '<hr class="divider">' +
      '<div class="list" id="objectifsList"></div>' +
      '<div class="add-form">' +

      '</div>' +
    '</div>' +
  '</section>';

function renderObjectifs(){
  const el = $("#objectifsList");
  if(!el) return;
  const items = stores.objectifs.items;
  el.innerHTML = items.length ? items.map(function(o){
    const color = o.couleur || "--rotary-blue";
    return '<div class="list-row" style="border-left-color:var(' + color + ')">' +
      '<div class="main-col">' +
        '<div class="title">' + esc(o.domaine) + '</div>' +
        (o.notes ? '<div class="meta">' + esc(o.notes) + '</div>' : '') +
      '</div>' +
      '<select class="statut-select" data-id="' + o.id + '">' +
        Object.keys(OBJ_STATUTS).map(function(k){
          return '<option value="' + k + '"' + (k === o.statut ? ' selected' : '') + '>' + esc(t(OBJ_STATUTS[k])) + '</option>';
        }).join("") +
      '</select>' +
      '<button class="btn icon-only" data-edit-obj="' + o.id + '">' + ICONS.edit + '</button>' +
      '<button class="btn icon-only" data-remove-obj="' + o.id + '">' + ICONS.trash + '</button>' +
    '</div>';
  }).join("") : '<div class="empty">' + esc(t("emptyAxes")) + '</div>';

  el.querySelectorAll("select").forEach(function(s){
    s.addEventListener("change", function(){
      stores.objectifs.updateItem(s.dataset.id, {statut:s.value});
      renderObjectifs();
      toast(t("toastModifie"));
    });
  });
  el.querySelectorAll("[data-remove-obj]").forEach(function(b){
    b.addEventListener("click", function(){
      if(confirm(t("confirmSuppr"))){
        stores.objectifs.removeItem(b.dataset.removeObj);
        toast(t("toastSupprime"));
      }
    });
  });
  el.querySelectorAll("[data-edit-obj]").forEach(function(b){
    b.addEventListener("click", function(){ editObjectif(b.dataset.editObj); });
  });

  const pct = items.length ? Math.round(items.reduce(function(s,o){
    return s + (o.statut === "atteint" ? 1 : o.statut === "en_cours" ? 0.5 : 0);
  }, 0) / items.length * 100) : 0;
  const bar = $("#objProgress"), lbl = $("#objProgressLabel");
  if(bar) bar.style.width = pct + "%";
  if(lbl) lbl.textContent = pct + "% " + t("objAxesEngages");
}

function editObjectif(id){
  const obj = stores.objectifs.items.find(function(o){ return o.id === id; });
  if(!obj) return;
  const nouveauNom = prompt("Nom de l'axe :", obj.domaine);
  if(nouveauNom === null) return;
  const nouvellesNotes = prompt("Notes (optionnel) :", obj.notes || "");
  if(nouvellesNotes === null) return;
  const nouvelleCouleur = prompt("Couleur (1-6) :\n1. Bleu Rotary\n2. Or Rotary\n3. Framboise Rotaract\n4. Bleu azur\n5. Turquoise\n6. Orange", String(OBJ_COULEURS.indexOf(obj.couleur || "--rotary-blue") + 1));
  if(nouvelleCouleur === null) return;
  const idx = Math.max(0, Math.min(5, parseInt(nouvelleCouleur, 10) - 1));
  stores.objectifs.updateItem(id, {
    domaine: nouveauNom.trim() || obj.domaine,
    notes: nouvellesNotes.trim(),
    couleur: OBJ_COULEURS[idx]
  });
  toast(t("toastModifie"));
}

function wireObjectifs(){
  const btn = $("#objAddBtn");
  if(!btn) return;
  btn.addEventListener("click", function(){
    const domaine = $("#objDomaine").value.trim();
    if(!domaine){ toast("Nom requis"); return; }
    stores.objectifs.add({
      domaine: domaine,
      statut: "a_initier",
      notes: "",
      couleur: OBJ_COULEURS[Math.floor(Math.random() * OBJ_COULEURS.length)]
    });
    $("#objDomaine").value = "";
    toast(t("toastAjoute"));
  });
}/* ---------------------------------------------------------------
   DÉMARRAGE DE L'APPLICATION
--------------------------------------------------------------- */
function boot(){
  // 1. Initialiser les stores (charge ou crée les données)
  initStores();

  // 2. Construire l'interface
  renderShell();

  // 3. Activer le sélecteur de langue
  wireLangSwitch();initTheme()

  // 4. Mettre à jour le sous-titre + devise selon la langue
  const sub = $("#brandSub");
  const motto = $("#brandMotto");
  if(sub) sub.innerHTML = t("brandSub");
  if(motto) motto.textContent = t("brandMotto");

  // 5. Afficher les stats du tableau de bord
  renderDashboardStats();

  // 6. Rendre le panneau actif
  renderActivePanel();

  console.log("Ndjindji IA — Application démarrée avec succès.");
  console.log("Mode : " + currentLang.toUpperCase());
  console.log("Données chargées : ", Object.keys(stores).map(function(k){
    return k + "=" + stores[k].items.length;
  }).join(", "));
wireObjectifs();
  setTimeout(initVoiceEngine, 500);
}

// Enregistrement du Service Worker (PWA, si disponible)
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(function(){ /* pas de SW, ce n'est pas grave */ });
}

// Lancer l'app quand le DOM est prêt
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
